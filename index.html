<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidPath3DViewer</title>
<style>
:root{--bg:#101114;--panel:#1b1d22ee;--ink:#e8e4da;--sub:#9a948a;--line:#33363d}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans SC",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block}
.panel{position:fixed;top:12px;left:12px;z-index:3;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  max-width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 60px);overflow:auto;
  backdrop-filter:blur(6px)}
.panel h1{font-size:16px;margin:0 0 2px}
.panel .sub{font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:10px}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
input[type=range]{flex:1;accent-color:#b39ddb}
label{display:flex;align-items:center;gap:8px;cursor:pointer}
.sep{border-top:1px solid var(--line);margin:9px 0}
#sets label{font-weight:600}
.hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;
  color:var(--sub);z-index:3;pointer-events:none}
#drop{position:fixed;inset:0;z-index:8;display:none;place-items:center;
  background:#000a;border:3px dashed #b39ddb;color:#fff;font-size:20px}
a{color:#b39ddb}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
 <h1>KidPath3DViewer</h1>
 <div class="sub">Serial-section glomerulus reconstructions.
   Drag &amp; drop your own <code>meshes.json</code> anywhere to add it.
   <a href="https://github.com/" id="repo-link" style="display:none">repo</a></div>
 <div id="sets"></div>
 <div class="sep"></div>
 <div class="ctl"><label><input type="checkbox" id="k-glom" checked>
   <span class="sw" style="background:#c9a15a"></span>glom capsule</label></div>
 <div class="ctl"><label><input type="checkbox" id="k-vessels" checked>
   <span class="sw" style="background:#4fbd82"></span>vessels</label></div>
 <div class="ctl"><label><input type="checkbox" id="k-mesangial" checked>
   <span class="sw" style="background:#d865c8"></span>mesangial</label></div>
 <div class="ctl"><label><input type="checkbox" id="k-cells" checked>
   <span class="sw" style="background:#f0c93c"></span>cells</label></div>
 <div class="sep"></div>
 <div class="ctl"><label><input type="checkbox" id="k-slices">
   <span class="sw" style="background:#9b7fb8"></span>H&amp;E slice planes</label></div>
 <div class="ctl"><span style="font-size:12px;color:var(--sub);width:70px">slice α</span>
   <input type="range" id="sop" min="5" max="100" value="85"></div>
 <div class="ctl"><label><input type="checkbox" id="stain"> real-stain meshes</label></div>
 <div class="ctl"><label><input type="checkbox" id="k-volume">
   <span class="sw" style="background:#c0768a"></span>RGB volume rendering</label></div>
 <div class="ctl"><label><input type="checkbox" id="vsolid" checked> solid-ball shading</label></div>
 <div class="ctl"><span style="font-size:12px;color:var(--sub);width:70px">density</span>
   <input type="range" id="vgain" min="10" max="300" value="100"></div>
 <div class="sep"></div>
 <div class="ctl"><span style="font-size:12px;color:var(--sub);width:70px">capsule α</span>
   <input type="range" id="op" min="0" max="60" value="14"></div>
 <div class="ctl"><span style="font-size:12px;color:var(--sub);width:70px">Z cut</span>
   <input type="range" id="clip" min="0" max="100" value="100"></div>
 <div class="ctl"><span style="font-size:12px;color:var(--sub);width:70px">X cut</span>
   <input type="range" id="clipx" min="0" max="100" value="100"></div>
 <div class="ctl"><span style="font-size:12px;color:var(--sub);width:70px">Y cut</span>
   <input type="range" id="clipy" min="0" max="100" value="100"></div>
 <div class="ctl"><label><input type="checkbox" id="spin" checked>auto-rotate</label></div>
</div>
<div class="hint">drag = rotate · wheel/pinch = zoom · right-drag = pan · drop a JSON to load</div>
<div id="drop">drop meshes JSON to load</div>
<script type="importmap">
{"imports":{"three":"vendor/three.module.js",
"three/addons/":"vendor/addons/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const bytes = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.localClippingEnabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101114);
const cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 8000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 1.1));
const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(1,1,1.5); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x8899ff, 0.5); dl2.position.set(-1,-0.5,-1); scene.add(dl2);
const clip  = new THREE.Plane(new THREE.Vector3(0,0,-1), 1e6);
const clipX = new THREE.Plane(new THREE.Vector3(-1,0,0), 1e6);
const clipY = new THREE.Plane(new THREE.Vector3(0,-1,0), 1e6);
const clips = [clip, clipX, clipY];
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.0;

function geo(m){
  const g = new THREE.BufferGeometry();
  let v;
  if (m.lo){ // quantised uint16
    const q = new Uint16Array(bytes(m.v).buffer);
    v = new Float32Array(q.length);
    for (let i=0;i<q.length;i+=3){
      v[i]=m.lo[0]+q[i]*m.scale[0]; v[i+1]=m.lo[1]+q[i+1]*m.scale[1]; v[i+2]=m.lo[2]+q[i+2]*m.scale[2];
    }
  } else v = new Float32Array(bytes(m.v).buffer);   // plain float32
  g.setAttribute('position', new THREE.BufferAttribute(v,3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(bytes(m.f).buffer),1));
  if (m.n) g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(bytes(m.n).buffer),3));
  else g.computeVertexNormals();
  if (m.c) g.setAttribute('color', new THREE.BufferAttribute(new Uint8Array(bytes(m.c)),3,true));
  return g;
}
const texLoader = new THREE.TextureLoader();

const datasets = [];     // {label, data, baseURL|null, group|null, on}
const capMats = [], sliceMats = [], volMats = [],
      classMeshes = {glom:[],vessels:[],mesangial:[],cells:[],slices:[],volume:[]};

const volVert = `
out vec3 vOrigin; out vec3 vDir;
void main(){
  vOrigin = (inverse(modelMatrix) * vec4(cameraPosition, 1.)).xyz;
  vDir = position - vOrigin;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.);
}`;
const volFrag = `
precision highp float; precision highp sampler3D;
in vec3 vOrigin; in vec3 vDir;
uniform sampler3D uTex; uniform vec3 uSize; uniform float uGain;
uniform float uClipZ; uniform float uClipX; uniform float uClipY; uniform int uMode;
out vec4 outColor;
vec2 hitBox(vec3 o, vec3 d){
  vec3 inv = 1. / d;
  vec3 t0 = (-0.5 * uSize - o) * inv, t1 = (0.5 * uSize - o) * inv;
  vec3 tmin = min(t0, t1), tmax = max(t0, t1);
  return vec2(max(max(tmin.x, tmin.y), tmin.z), min(min(tmax.x, tmax.y), tmax.z));
}
float alphaAt(vec3 uv){ return texture(uTex, uv).a; }
void main(){
  vec3 dir = normalize(vDir);
  vec2 t = hitBox(vOrigin, dir);
  if (t.x > t.y) discard;
  t.x = max(t.x, 0.);
  float stepLen = max(uSize.x, max(uSize.y, uSize.z)) / 340.;
  if (uMode == 1){
    // solid-surface mode: first hit on the ball mask, gradient-shaded
    for (int i = 0; i < 480; i++){
      float tt = t.x + float(i) * stepLen;
      if (tt > t.y) break;
      vec3 q = vOrigin + tt * dir;
      if (q.z > uClipZ || q.x > uClipX || q.y > uClipY) continue;
      vec3 uv = (q + 0.5 * uSize) / uSize;
      vec4 s = texture(uTex, uv);
      if (s.a > 0.5){
        vec3 n;
        if (uClipZ - q.z < stepLen * 2.5){
          n = vec3(0., 0., 1.);              // the cut faces
        } else if (uClipX - q.x < stepLen * 2.5){
          n = vec3(1., 0., 0.);
        } else if (uClipY - q.y < stepLen * 2.5){
          n = vec3(0., 1., 0.);
        } else {
          vec3 e = 1.5 / vec3(textureSize(uTex, 0));
          vec3 g = vec3(
            alphaAt(uv + vec3(e.x,0.,0.)) - alphaAt(uv - vec3(e.x,0.,0.)),
            alphaAt(uv + vec3(0.,e.y,0.)) - alphaAt(uv - vec3(0.,e.y,0.)),
            alphaAt(uv + vec3(0.,0.,e.z)) - alphaAt(uv - vec3(0.,0.,e.z))) / uSize;
          n = -normalize(g + 1e-6);
        }
        vec3 L = normalize(vec3(0.45, -0.55, 0.75));
        float diff = max(dot(n, L), 0.);
        float head = max(dot(n, -dir), 0.);
        float rim  = pow(1. - head, 2.5) * 0.18;
        vec3 col = s.rgb * (0.34 + 0.46 * diff + 0.28 * head) + rim;
        outColor = vec4(col, 1.);
        return;
      }
    }
    discard;
  }
  // cloud mode: emission-absorption, alpha weighted by stain density
  vec4 acc = vec4(0.);
  for (int i = 0; i < 480; i++){
    float tt = t.x + float(i) * stepLen;
    if (tt > t.y || acc.a > 0.98) break;
    vec3 q = vOrigin + tt * dir;
    if (q.z > uClipZ || q.x > uClipX || q.y > uClipY) continue;
    vec4 s = texture(uTex, (q + 0.5 * uSize) / uSize);
    float density = clamp(1.05 - dot(s.rgb, vec3(0.299, 0.587, 0.114)), 0., 1.);
    float a = clamp(s.a * (0.10 + 1.6 * density) * uGain * stepLen * 0.12, 0., 1.);
    acc.rgb += (1. - acc.a) * a * s.rgb;
    acc.a   += (1. - acc.a) * a;
  }
  if (acc.a < 0.01) discard;
  outColor = vec4(acc.rgb / max(acc.a, 1e-4), acc.a);
}`;

async function loadVolumeTexture(vol, baseURL){
  const img = await new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej;
    im.src = baseURL + vol.atlas;
  });
  const cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const cx = cv.getContext('2d', {willReadFrequently: true});
  cx.drawImage(img, 0, 0);
  const px = cx.getImageData(0, 0, img.width, img.height).data;
  const {nx, ny, nz, cols} = vol;
  const data = new Uint8Array(nx * ny * nz * 4);
  for (let z = 0; z < nz; z++){
    const ri = (z / cols) | 0, ci = z % cols;
    for (let y = 0; y < ny; y++){
      const src = ((ri * ny + y) * img.width + ci * nx) * 4;
      data.set(px.subarray(src, src + nx * 4), (z * ny + y) * nx * 4);
    }
  }
  const tex = new THREE.Data3DTexture(data, nx, ny, nz);
  tex.format = THREE.RGBAFormat;
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.unpackAlignment = 1; tex.needsUpdate = true;
  return tex;
}

function rebuild(){
  for (const d of datasets) if (d.group){ scene.remove(d.group); d.group=null; }
  capMats.length=0; sliceMats.length=0; volMats.length=0;
  for (const k in classMeshes) classMeshes[k].length=0;
  const act = datasets.filter(d=>d.on);
  if (!act.length){ render(); return; }
  const built = act.map(d=>{
    const gGlom = geo(d.data.meshes.glom);
    gGlom.computeBoundingBox();
    const bb=gGlom.boundingBox, ctr=new THREE.Vector3(); bb.getCenter(ctr);
    return {d, gGlom, ctr, w: bb.max.x-bb.min.x,
            xmin:bb.min.x-ctr.x, xmax:bb.max.x-ctr.x,
            ymin:bb.min.y-ctr.y, ymax:bb.max.y-ctr.y,
            zmin:bb.min.z-ctr.z, zmax:bb.max.z-ctr.z};
  });
  const GAP=50, total=built.reduce((a,b)=>a+b.w,0)+GAP*(built.length-1);
  let cursor=-total/2, zlo=1e9, zhi=-1e9, xlo=1e9, xhi=-1e9, ylo=1e9, yhi=-1e9;
  for (const b of built){
    const xoff = cursor + b.w/2; cursor += b.w+GAP;
    zlo=Math.min(zlo,b.zmin); zhi=Math.max(zhi,b.zmax);
    xlo=Math.min(xlo,b.xmin+xoff); xhi=Math.max(xhi,b.xmax+xoff);
    ylo=Math.min(ylo,b.ymin); yhi=Math.max(yhi,b.ymax);
    const grp = new THREE.Group();
    const matGlom = new THREE.MeshPhysicalMaterial({color:0xc9a15a,transparent:true,
      opacity:+document.getElementById('op').value/100,roughness:0.6,side:THREE.DoubleSide,
      depthWrite:false,clippingPlanes:clips});
    capMats.push(matGlom);
    const defs=[['vessels',new THREE.MeshStandardMaterial({color:0x4fbd82,roughness:0.45,clippingPlanes:clips}),0],
                ['mesangial',new THREE.MeshStandardMaterial({color:0xd865c8,roughness:0.6,transparent:true,opacity:0.75,clippingPlanes:clips}),1],
                ['glom',matGlom,2]];
    for (const [cls,mat,ord] of defs){
      if(!b.d.data.meshes[cls]) continue;
      const mesh=new THREE.Mesh(cls==='glom'?b.gGlom:geo(b.d.data.meshes[cls]),mat);
      mesh.position.set(xoff-b.ctr.x,-b.ctr.y,-b.ctr.z); mesh.renderOrder=ord;
      mesh.visible=document.getElementById('k-'+cls).checked;
      mesh.userData.base=mat.color.getHex();
      grp.add(mesh); classMeshes[cls].push(mesh);
    }
    const sl=b.d.data.slices;
    if (sl && b.d.baseURL){
      const show=document.getElementById('k-slices').checked;
      const sop=+document.getElementById('sop').value/100;
      for (const it of sl.items){
        const tex=texLoader.load(b.d.baseURL+sl.dir+'/'+it.f);
        tex.flipY=false; tex.colorSpace=THREE.SRGBColorSpace;
        const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:sop,
          side:THREE.DoubleSide,depthWrite:false,clippingPlanes:clips});
        const pl=new THREE.Mesh(new THREE.PlaneGeometry(sl.w,sl.h),mat);
        pl.position.set(sl.x0+sl.w/2-b.ctr.x+xoff, sl.y0+sl.h/2-b.ctr.y, it.z-b.ctr.z);
        pl.renderOrder=3; pl.visible=show;
        grp.add(pl); classMeshes.slices.push(pl); sliceMats.push(mat);
      }
    }
    const cells=b.d.data.cells;
    if (cells && cells.n){
      const cp=new Float32Array(bytes(cells.p).buffer), cr=new Float32Array(bytes(cells.r).buffer);
      const inst=new THREE.InstancedMesh(new THREE.SphereGeometry(1,12,10),
        new THREE.MeshStandardMaterial({color:0xf0c93c,roughness:0.5,clippingPlanes:clips}),cells.n);
      const M=new THREE.Matrix4();
      for(let i=0;i<cells.n;i++){
        M.makeScale(cr[i],cr[i],cr[i]);
        M.setPosition(cp[3*i]+xoff-b.ctr.x,cp[3*i+1]-b.ctr.y,cp[3*i+2]-b.ctr.z);
        inst.setMatrixAt(i,M);
      }
      inst.visible=document.getElementById('k-cells').checked;
      grp.add(inst); classMeshes.cells.push(inst);
    }
    const vol=b.d.data.volume;
    if (vol && b.d.baseURL){
      const grpRef=grp, ctr=b.ctr, xo=xoff;
      loadVolumeTexture(vol, b.d.baseURL).then(tex=>{
        if (b.d.group!==grpRef) return;    // rebuilt meanwhile
        const d3=vol.nz*vol.dz;
        const mat=new THREE.ShaderMaterial({glslVersion:THREE.GLSL3,
          vertexShader:volVert, fragmentShader:volFrag, transparent:true,
          side:THREE.BackSide, depthWrite:false,
          uniforms:{uTex:{value:tex}, uSize:{value:new THREE.Vector3(vol.w,vol.h,d3)},
                    uGain:{value:+document.getElementById('vgain').value/50},
                    uMode:{value:document.getElementById('vsolid').checked?1:0},
                    uClipZ:{value:1e6}, uClipX:{value:1e6}, uClipY:{value:1e6}}});
        const box=new THREE.Mesh(new THREE.BoxGeometry(vol.w,vol.h,d3), mat);
        box.position.set(vol.x0+vol.w/2-ctr.x+xo, vol.y0+vol.h/2-ctr.y,
                         vol.z0+(vol.nz-1)*vol.dz/2-ctr.z);
        box.renderOrder=4;
        box.visible=document.getElementById('k-volume').checked;
        grpRef.add(box); classMeshes.volume.push(box); volMats.push(mat);
      });
    }
    scene.add(grp); b.d.group=grp;
  }
  clip.constant=clipX.constant=clipY.constant=1e6;
  for (const id of ['clip','clipx','clipy']) document.getElementById(id).value=100;
  window._lims={z:[zlo,zhi], x:[xlo,xhi], y:[ylo,yhi]};
  const R=Math.max(total,120)*1.35;
  cam.position.set(0,-R*0.75,R*0.55); controls.target.set(0,0,0);
}

function refreshSetList(){
  const el=document.getElementById('sets'); el.innerHTML='';
  datasets.forEach((d,i)=>{
    const div=document.createElement('div'); div.className='ctl';
    div.innerHTML=`<label><input type="checkbox" ${d.on?'checked':''}> ${d.label}</label>`;
    div.querySelector('input').onchange=e=>{d.on=e.target.checked; rebuild();};
    el.appendChild(div);
  });
}
function addDataset(label,data,on,baseURL){
  datasets.push({label,data,baseURL:baseURL||null,group:null,on});
  refreshSetList(); rebuild();
}

// controls
for (const k of ['glom','vessels','mesangial','cells','slices','volume'])
  document.getElementById('k-'+k).onchange=e=>classMeshes[k].forEach(m=>m.visible=e.target.checked);
document.getElementById('vgain').oninput=e=>volMats.forEach(m=>m.uniforms.uGain.value=e.target.value/50);
document.getElementById('vsolid').onchange=e=>volMats.forEach(m=>m.uniforms.uMode.value=e.target.checked?1:0);
document.getElementById('op').oninput=e=>capMats.forEach(m=>m.opacity=e.target.value/100);
document.getElementById('sop').oninput=e=>sliceMats.forEach(m=>m.opacity=e.target.value/100);
document.getElementById('stain').onchange=e=>{
  const on=e.target.checked;
  for (const k of ['glom','vessels','mesangial'])
    for (const mesh of classMeshes[k]){
      if (!mesh.geometry.getAttribute('color')) continue;
      mesh.material.vertexColors=on;
      mesh.material.color.set(on?0xffffff:mesh.userData.base);
      mesh.material.needsUpdate=true;
    }
};
const cutDefs={clip:['z',clip], clipx:['x',clipX], clipy:['y',clipY]};
for (const id in cutDefs) document.getElementById(id).oninput=e=>{
  const t=e.target.value/100, [axis,plane]=cutDefs[id];
  const [a,b]=(window._lims||{})[axis]||[-50,50];
  plane.constant=(t>=1)?1e6:(a+t*(b-a));
};
document.getElementById('spin').onchange=e=>{controls.autoRotate=e.target.checked;};

// drag & drop
const drop=document.getElementById('drop');
addEventListener('dragover',e=>{e.preventDefault();drop.style.display='grid';});
drop.addEventListener('dragleave',()=>drop.style.display='none');
addEventListener('drop',async e=>{
  e.preventDefault(); drop.style.display='none';
  for (const f of e.dataTransfer.files){
    try{ addDataset(f.name.replace('.json',''), JSON.parse(await f.text()), true); }
    catch(err){ alert('not a valid meshes JSON: '+f.name); }
  }
});

// ?src=<file-or-url>: open any meshes JSON straight from the address bar,
// e.g. index.html?src=myglom.json — textures resolve relative to the JSON.
const srcs=new URLSearchParams(location.search).getAll('src');
for (const u of srcs){
  try{
    const j=await (await fetch(u)).json();
    const base=u.includes('/')?u.slice(0,u.lastIndexOf('/')+1):'';
    const label=decodeURIComponent(u.split('/').pop().replace(/\.json$/i,''));
    addDataset(label, j, true, base);
  }catch(err){ alert('cannot load '+u+': '+err.message); }
}

// bundled demo data (skipped when ?src= is given)
if (!srcs.length) try{
  const idx=await (await fetch('data/index.json')).json();
  for (const it of idx)
    addDataset(it.label, await (await fetch('data/'+it.file)).json(), true, 'data/');
}catch(e){ /* no bundled data; drag & drop still works */ }

function resize(){ renderer.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
function render(){ renderer.render(scene,cam); }
renderer.setAnimationLoop(()=>{
  controls.update();
  for (const m of classMeshes.volume){
    m.material.uniforms.uClipZ.value = clip.constant  - m.position.z;
    m.material.uniforms.uClipX.value = clipX.constant - m.position.x;
    m.material.uniforms.uClipY.value = clipY.constant - m.position.y;
  }
  render();
});
</script>
</body>
</html>
